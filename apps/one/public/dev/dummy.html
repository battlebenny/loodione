<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dev — Loodi</title>
<style>
*,::before,::after{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg: #f1f1ef;
  --text: #353533;
  --card-bg: rgba(255,255,255,0.7);
  --card-border: rgba(0,0,0,0.05);
  --accent: #6B7280;
  --accent-hover: #4b5563;
  --tag-bg: rgba(0,0,0,0.04);
  --log-bg: rgba(0,0,0,0.02);
  --font-sans: "DM Sans","Inter",system-ui,sans-serif;
  --font-display: "Playfair Display",Georgia,serif;
  --font-mono: "JetBrains Mono",monospace;
  --shell-safe-top: 0px;
  --shell-safe-bottom: 0px;
}
html.dark {
  --bg: #1a1a18;
  --text: #e8e7e4;
  --card-bg: rgba(17,24,39,0.7);
  --card-border: rgba(255,255,255,0.1);
  --accent: #6B7280;
  --accent-hover: #9ca3af;
  --tag-bg: rgba(255,255,255,0.06);
  --log-bg: rgba(255,255,255,0.02);
}

html{background:var(--bg);color:var(--text);font-family:var(--font-sans);scroll-padding-top:var(--shell-safe-top)}
body{max-width:480px;margin:0 auto;padding:calc(20px + var(--shell-safe-top)) 16px calc(20px + var(--shell-safe-bottom))}

h1{font-family:var(--font-display);font-size:clamp(1.25rem,4vw,1.75rem);font-weight:400;line-height:1.2;text-wrap:balance;margin-bottom:4px}
.env{font-size:0.75rem;color:var(--text);opacity:0.5;margin-bottom:20px}

#pageContent{padding:12px 16px;background:var(--card-bg);border-radius:1rem;border:1px solid var(--card-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-bottom:12px}
#pageContent h2{font-family:var(--font-sans);font-size:1rem;font-weight:500;margin-bottom:6px}
#pageContent p{font-size:0.875rem;opacity:0.6;line-height:1.5}

.card{background:var(--card-bg);border-radius:1rem;border:1px solid var(--card-border);padding:16px;margin-bottom:12px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card:last-child{margin-bottom:0}
.card h2{font-family:var(--font-sans);font-size:0.75rem;font-weight:500;line-height:1.3;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--text);opacity:0.4;margin-bottom:10px}

.btn-group{display:flex;flex-wrap:wrap;gap:6px}
button{font-family:var(--font-sans);font-size:0.8125rem;padding:5px 11px;border-radius:8px;border:1px solid transparent;
  background:var(--tag-bg);color:var(--text);cursor:pointer;transition:background .15s,opacity .15s}
button:hover{opacity:0.8}
button:active{transform:scale(0.97);opacity:0.6}

.result{font-size:0.8125rem;margin-top:8px;padding:8px 10px;background:var(--tag-bg);border-radius:8px;word-break:break-all;
  font-family:var(--font-mono);line-height:1.4;white-space:pre-wrap}

.status{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status.connected{background:#6B7280}
.status.disconnected{background:rgba(0,0,0,0.2)}

#themeDisplay{font-size:0.875rem;color:var(--text);opacity:0.6}

.log{font-size:0.75rem;font-family:var(--font-mono)}
.log-entry{padding:3px 0;border-bottom:1px solid var(--card-border)}
.log-entry:last-child{border-bottom:none}
.log-entry .time{opacity:0.4;margin-right:8px}
.log-entry .dir{font-weight:600;margin-right:4px}
.log-entry .dir.in{color:#6B7280}
.log-entry .dir.out{color:var(--text);opacity:0.5}
.log-entry .dir.err{color:#ca4a16}
</style>
</head>
<body>

<h1>Dev Test</h1>
<p class="env"><span class="status disconnected" id="statusDot"></span><span id="mode">standalone</span> · <span id="iframesrc">—</span></p>

<div id="pageContent">
  <h2 id="pageTitle">Accueil</h2>
  <p id="pageDesc">Module de test pour le bridge Loodi. Utilisez la BottomNav ou les boutons ci-dessous.</p>
</div>

<div class="card">
<h2>RPC Methods</h2>
<div class="btn-group">
<button onclick="call('getUser')">getUser</button>
<button onclick="call('getToken')">getToken</button>
<button onclick="call('getNetworkStatus')">getNetworkStatus</button>
<button onclick="call('getCollection')">getCollection</button>
<button onclick="call('openApp','loodi')">openApp loodi</button>
<button onclick="call('closeApp')">closeApp</button>
<button onclick="call('showAppSwitcher')">showAppSwitcher</button>
<button onclick="call('requestPermission','camera')">requestPermission</button>
</div>
<div id="rpcResult" class="result">Cliquez un bouton</div>
</div>

<div class="card">
<h2>État</h2>
<div class="btn-group">
<button onclick="emitReady()">loodi:ready</button>
<button onclick="badgeCount()">badgeCount</button>
<button onclick="setBottomNavDemo()">setBottomNav</button>
</div>
</div>

<div class="card">
<h2>Overlay <span id="overlayStatus" class="status disconnected"></span></h2>
<div class="btn-group">
<button onclick="emitOverlayChange(true)">Ouvrir</button>
<button onclick="emitOverlayChange(false)">Fermer</button>
</div>
<div id="overlayResult" class="result">Fermé</div>
</div>

<div class="card">
<h2>Thème</h2>
<p id="themeDisplay">En attente…</p>
</div>

<div class="card">
<h2>Log</h2>
<div id="log" class="log"><div class="log-entry"><span class="time">—</span>Prêt</div></div>
</div>

<script>
const MODE = window.self !== window.top ? 'iframe' : 'standalone'
const shellParams = new URLSearchParams(window.location.search)
const shellClearance = (name) => Math.max(0, Number.parseFloat(shellParams.get(name) || '0') || 0)
const viewportSafeArea = shellParams.get('viewportSafeArea') === '1'
document.documentElement.style.setProperty('--shell-safe-top', `${viewportSafeArea ? 0 : shellClearance('headerHeight')}px`)
document.documentElement.style.setProperty('--shell-safe-bottom', `${viewportSafeArea ? 0 : shellClearance('bottomNavHeight')}px`)
let callId = 0
let msgHandler = null
let currentPage = 'accueil'

const PAGES = {
  accueil: { title: 'Accueil', desc: 'Module de test pour le bridge Loodi. Utilisez la BottomNav ou les boutons ci-dessous.' },
  feed: { title: 'Feed', desc: 'Fil d\'actualité factice du module de test.' },
  search: { title: 'Chercher', desc: 'Page de recherche factice du module de test.' },
  profile: { title: 'Profil', desc: 'Profil factice du module de test.' },
}

function renderPage(id) {
  const page = PAGES[id] || PAGES.accueil
  document.getElementById('pageTitle').textContent = page.title
  document.getElementById('pageDesc').textContent = page.desc
}

function log(msg, dir) {
  const el = document.getElementById('log')
  const t = new Date().toLocaleTimeString()
  const entry = document.createElement('div')
  entry.className = 'log-entry'
  entry.innerHTML = `<span class="time">${t}</span><span class="dir ${dir}">${dir === 'in' ? '◀' : dir === 'err' ? '✕' : '▶'}</span>${msg}`
  el.prepend(entry)
}

let overlayOpen = false

function emitReady() {
  parent.postMessage({ type: 'loodi:ready' }, '*')
  log('loodi:ready → shell', 'out')
}

function emitOverlayChange(visible) {
  overlayOpen = visible
  parent.postMessage({ type: 'loodi:event', event: 'loodi:overlaychange', detail: { visible } }, '*')
  log(`loodi:overlaychange {visible:${visible}} → shell`, 'out')
  document.getElementById('overlayStatus').className = `status ${visible ? 'connected' : 'disconnected'}`
  document.getElementById('overlayResult').textContent = visible ? 'Ouvert' : 'Fermé'
}

function badgeCount() {
  const n = Math.floor(Math.random() * 10) + 1
  parent.postMessage({ type: 'loodi:event', event: 'loodi:badgecount', detail: { count: n } }, '*')
  log(`loodi:badgecount {count:${n}} → shell`, 'out')
}

function setBottomNavDemo() {
  const tabs = [
    { id: 'accueil', icon: 'home', label: 'Accueil' },
  ]
  doCall('setBottomNav', [tabs])
    .then(() => log('setBottomNav → OK', 'out'))
}

function call(method, ...args) {
  doCall(method, args)
    .then(r => {
      document.getElementById('rpcResult').textContent = `${method} → ${JSON.stringify(r, null, 2)}`
    })
    .catch(e => {
      document.getElementById('rpcResult').textContent = `${method} → ✕ ${e}`
    })
}

function doCall(method, args = []) {
  return new Promise((resolve, reject) => {
    const id = ++callId
    const timeout = setTimeout(() => {
      cleanup()
      reject(new Error('timeout'))
    }, 10000)

    function cleanup() {
      clearTimeout(timeout)
      window.removeEventListener('message', msgHandler)
    }

    msgHandler = (e) => {
      if (e.data?.type === 'loodi:response' && e.data.id === id) {
        cleanup()
        log(`call ${method} → ${JSON.stringify(e.data.result ?? e.data.error)}`, 'in')
        if (e.data.error) reject(new Error(e.data.error))
        else resolve(e.data.result)
      }
    }

    window.addEventListener('message', msgHandler)
    parent.postMessage({ type: 'loodi:call', method, args, id }, '*')
    log(`call ${method} ${JSON.stringify(args)} → shell`, 'out')
  })
}

function applyTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark')
  document.getElementById('themeDisplay').textContent = `Thème : ${theme}`
}

const urlTheme = new URLSearchParams(window.location.search).get('theme')
if (urlTheme) applyTheme(urlTheme)

window.addEventListener('message', (e) => {
  const d = e.data
  if (!d || typeof d !== 'object') return

  if (d.type === 'loodi:event') {
    log(`event ${d.event} ${JSON.stringify(d.detail)}`, 'in')
    if (d.event === 'loodi:themechange') {
      applyTheme(d.detail.theme)
    }
    if (d.event === 'loodi:tabtap') {
      currentPage = d.detail.tabId
      renderPage(currentPage)
      log(`navigation → ${currentPage}`, 'out')
    }
    return
  }
  if (d.type === 'loodi:response') return
})

let ticking
window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      parent.postMessage({ type: 'loodi:event', event: 'loodi:scroll', detail: { scrollY: window.scrollY } }, '*')
      ticking = false
    })
    ticking = true
  }
})

document.getElementById('mode').textContent = MODE
document.getElementById('iframesrc').textContent = document.referrer || 'direct'
if (MODE === 'iframe') {
  document.getElementById('statusDot').className = 'status connected'
}

renderPage('accueil')
setTimeout(emitReady, 300)
</script>
</body>
</html>
